[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genrelay"
version = "0.1.1"
description = "Unified Python client for Veo 3.1, Grok Imagine, Nano Banana and other video & image generation models via the GenRelay API"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "GenRelay" }]
keywords = [
    "veo",
    "veo-3",
    "grok-imagine",
    "nano-banana",
    "text-to-video",
    "image-to-video",
    "video-generation",
    "image-generation",
    "generative-ai",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://genrelay.ai"
Documentation = "https://genrelay.ai/docs"
Source = "https://github.com/gaoruitech/genrelay-python"
Issues = "https://github.com/gaoruitech/genrelay-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/genrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: let the tests import the package without an editable install,
# so `pytest` works straight after a clone.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
